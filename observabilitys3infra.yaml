AWSTemplateFormatVersion: '2010-09-09'
Description: VoiceOps demo - observability infrastructure only. CSV files are uploaded manually to S3 and replayed into CloudWatch.

Parameters:
  Environment:
    Type: String
    Default: demo

  MetricNamespace:
    Type: String
    Default: VoiceOps/Demo

  DatabaseCsvKey:
    Type: String
    Default: checkout_api_mock.csv

  LambdaThrottlingCsvKey:
    Type: String
    Default: lambda_throttling_mock.csv

  PaymentCsvKey:
    Type: String
    Default: payment_api_mock.csv

Resources:
  TelemetryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/voiceops/${Environment}/application'
      RetentionInDays: 7

  ReplayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ReplayAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${TelemetryBucket.Arn}/*'

              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'

              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${ApplicationLogGroup.Arn}:*'

  ReplayFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub 'voiceops-replay-${Environment}'
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt ReplayRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref TelemetryBucket
          DATABASE_KEY: !Ref DatabaseCsvKey
          LAMBDA_KEY: !Ref LambdaThrottlingCsvKey
          PAYMENT_KEY: !Ref PaymentCsvKey
          NAMESPACE: !Ref MetricNamespace
          LOG_GROUP: !Ref ApplicationLogGroup
      Code:
        ZipFile: |
          import boto3
          import csv
          import io
          import json
          import os
          import time
          from datetime import datetime, timedelta, timezone

          s3 = boto3.client('s3')
          cw = boto3.client('cloudwatch')
          logs = boto3.client('logs')

          def metric(name, value, service, ts, unit):
              return {
                  'MetricName': name,
                  'Dimensions': [
                      {'Name': 'ServiceName', 'Value': service}
                  ],
                  'Timestamp': ts,
                  'Value': float(value),
                  'Unit': unit
              }

          def load_csv(key):
              obj = s3.get_object(
                  Bucket=os.environ['BUCKET'],
                  Key=key
              )

              return list(
                  csv.DictReader(
                      io.StringIO(
                          obj['Body'].read().decode('utf-8-sig')
                      )
                  )
              )

          def lambda_handler(event, context):
              db_rows = load_csv(os.environ['DATABASE_KEY'])
              lambda_rows = load_csv(os.environ['LAMBDA_KEY'])
              payment_rows = load_csv(os.environ['PAYMENT_KEY'])

              now = datetime.now(timezone.utc).replace(
                  second=0,
                  microsecond=0
              )

              metrics = []
              log_events = []

              # --------------------------------------------------
              # CSV 1: checkout_api_mock.csv
              # Publishes checkout-api service metrics and DB logs.
              # --------------------------------------------------
              for row in db_rows:
                  ts = now - timedelta(
                      minutes=(
                          len(db_rows)
                          - 1
                          - int(row['relative_minute'])
                      )
                  )

                  service = row['service']

                  metrics.extend([
                      metric('Latency', row['latency_ms'], service, ts, 'Milliseconds'),
                      metric('ErrorRate', row['error_rate_pct'], service, ts, 'Percent'),
                      metric('TPS', row['tps'], service, ts, 'Count/Second'),
                      metric('CPUUtilization', row['cpu_pct'], service, ts, 'Percent'),
                      metric('MemoryUtilization', row['memory_pct'], service, ts, 'Percent')
                  ])

                  entry = {
                      'timestamp': ts.isoformat(),
                      'level': 'ERROR' if int(row['http_status']) >= 500 else 'INFO',
                      'service': service,
                      'phase': row['phase'],
                      'http_status': int(row['http_status']),
                      'error_type': row['error_type'],
                      'deployment_version': row['deployment_version'],
                      'latency_ms': float(row['latency_ms']),
                      'error_rate_pct': float(row['error_rate_pct'])
                  }

                  if row.get('error_message'):
                      entry['message'] = row['error_message']

                  log_events.append({
                      'timestamp': int(ts.timestamp() * 1000),
                      'message': json.dumps(entry)
                  })

              # --------------------------------------------------
              # CSV 2: lambda_throttling_mock.csv
              # Publishes order-worker metrics and throttling logs.
              # --------------------------------------------------
              for row in lambda_rows:
                  ts = now - timedelta(
                      minutes=(
                          len(lambda_rows)
                          - 1
                          - int(row['relative_minute'])
                      )
                  )

                  dependency = row.get('dependency') or 'order-worker'

                  metrics.extend([
                      metric('Invocations', row['lambda_invocations'], dependency, ts, 'Count'),
                      metric('ConcurrentExecutions', row['lambda_concurrent_executions'], dependency, ts, 'Count'),
                      metric('ConcurrencyLimit', row['lambda_concurrency_limit'], dependency, ts, 'Count'),
                      metric('Throttles', row['lambda_throttles'], dependency, ts, 'Count'),
                      metric('Duration', row['lambda_duration_ms'], dependency, ts, 'Milliseconds')
                  ])

                  entry = {
                      'timestamp': ts.isoformat(),
                      'level': 'ERROR' if int(row['http_status']) >= 500 else 'INFO',
                      'service': row.get('service') or 'checkout-api',
                      'dependency': dependency,
                      'phase': row['phase'],
                      'http_status': int(row['http_status']),
                      'error_type': row['error_type'],
                      'deployment_version': row['deployment_version'],
                      'lambda_invocations': int(float(row['lambda_invocations'])),
                      'lambda_concurrent_executions': int(float(row['lambda_concurrent_executions'])),
                      'lambda_concurrency_limit': int(float(row['lambda_concurrency_limit'])),
                      'lambda_throttles': int(float(row['lambda_throttles'])),
                      'retry_attempts': int(float(row.get('retry_attempts') or 0))
                  }

                  if row.get('error_message'):
                      entry['message'] = row['error_message']

                  log_events.append({
                      'timestamp': int(ts.timestamp() * 1000),
                      'message': json.dumps(entry)
                  })


              # --------------------------------------------------
              # CSV 3: payment_api_mock.csv
              # Publishes healthy payment-api service metrics only.
              # --------------------------------------------------
              for row in payment_rows:
                  ts = now - timedelta(
                      minutes=(
                          len(payment_rows)
                          - 1
                          - int(row['relative_minute'])
                      )
                  )

                  service = row.get('service') or 'payment-api'

                  metrics.extend([
                      metric('Latency', row['latency_ms'], service, ts, 'Milliseconds'),
                      metric('ErrorRate', row['error_rate_pct'], service, ts, 'Percent'),
                      metric('TPS', row['tps'], service, ts, 'Count/Second'),
                      metric('CPUUtilization', row['cpu_pct'], service, ts, 'Percent'),
                      metric('MemoryUtilization', row['memory_pct'], service, ts, 'Percent')
                  ])

              for i in range(0, len(metrics), 1000):
                  cw.put_metric_data(
                      Namespace=os.environ['NAMESPACE'],
                      MetricData=metrics[i:i + 1000]
                  )

              stream = 'combined-' + str(int(time.time()))

              logs.create_log_stream(
                  logGroupName=os.environ['LOG_GROUP'],
                  logStreamName=stream
              )

              logs.put_log_events(
                  logGroupName=os.environ['LOG_GROUP'],
                  logStreamName=stream,
                  logEvents=sorted(
                      log_events,
                      key=lambda x: x['timestamp']
                  )
              )

              return {
                  'statusCode': 200,
                  'body': json.dumps({
                      'published_metric_points': len(metrics),
                      'published_log_events': len(log_events),
                      'log_stream': stream,
                      'database_csv': os.environ['DATABASE_KEY'],
                      'lambda_throttling_csv': os.environ['LAMBDA_KEY'],
                      'payment_csv': os.environ['PAYMENT_KEY']
                  })
              }

Outputs:
  TelemetryBucketName:
    Description: Manually upload all three CSV files into this bucket.
    Value: !Ref TelemetryBucket

  ReplayFunctionName:
    Description: Invoke this Lambda after all three CSV files are uploaded.
    Value: !Ref ReplayFunction

  MetricNamespace:
    Value: !Ref MetricNamespace

  ApplicationLogGroupName:
    Value: !Ref ApplicationLogGroup

  DatabaseCsvKey:
    Value: !Ref DatabaseCsvKey

  LambdaThrottlingCsvKey:
    Value: !Ref LambdaThrottlingCsvKey

  PaymentCsvKey:
    Value: !Ref PaymentCsvKey
