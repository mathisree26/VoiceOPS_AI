AWSTemplateFormatVersion: '2010-09-09'
Description: VoiceOps demo - Bedrock Knowledge Base with S3 source documents and S3 Vectors

Parameters:
  Environment:
    Type: String
    Default: demo

  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0

Resources:
  KnowledgeSourceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  VectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EncryptionConfiguration:
        SseType: AES256

  VectorIndex:
    Type: AWS::S3Vectors::Index
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
      DataType: float32
      Dimension: 1024
      DistanceMetric: cosine

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*'
      Policies:
        - PolicyName: VoiceOpsKnowledgeBaseAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeEmbeddingModel
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'

              - Sid: ListKnowledgeSourceBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt KnowledgeSourceBucket.Arn

              - Sid: ReadKnowledgeDocuments
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${KnowledgeSourceBucket.Arn}/*'

              - Sid: S3VectorIndexAccess
                Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetIndex
                Resource: !GetAtt VectorIndex.IndexArn

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn:
      - VectorIndex
    Properties:
      Name: !Sub 'voiceops-${Environment}-kb'
      Description: VoiceOps operational runbooks, service documentation, and previous incidents.
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub 'arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}'
          EmbeddingModelConfiguration:
            BedrockEmbeddingModelConfiguration:
              Dimensions: 1024
              EmbeddingDataType: FLOAT32
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          VectorBucketArn: !GetAtt VectorBucket.VectorBucketArn
          IndexArn: !GetAtt VectorIndex.IndexArn

  KnowledgeDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      Name: !Sub 'voiceops-${Environment}-s3-docs'
      Description: S3 source documents for VoiceOps operational knowledge.
      KnowledgeBaseId: !Ref KnowledgeBase
      DataDeletionPolicy: RETAIN
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KnowledgeSourceBucket.Arn
      VectorIngestionConfiguration:
        ChunkingConfiguration:
          ChunkingStrategy: FIXED_SIZE
          FixedSizeChunkingConfiguration:
            MaxTokens: 500
            OverlapPercentage: 20

Outputs:
  KnowledgeSourceBucketName:
    Description: Upload the checkout and Lambda-throttling Markdown documents here.
    Value: !Ref KnowledgeSourceBucket

  KnowledgeBaseId:
    Value: !Ref KnowledgeBase

  KnowledgeBaseArn:
    Value: !GetAtt KnowledgeBase.KnowledgeBaseArn

  DataSourceId:
    Value: !GetAtt KnowledgeDataSource.DataSourceId

  VectorBucketArn:
    Value: !GetAtt VectorBucket.VectorBucketArn

  VectorIndexArn:
    Value: !GetAtt VectorIndex.IndexArn
