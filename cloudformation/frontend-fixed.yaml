AWSTemplateFormatVersion: '2010-09-09'
Description: VoiceOps - private S3 + CloudFront frontend with Cognito authenticated Transcribe access and canonical custom-domain enforcement

Parameters:
  Environment:
    Type: String
    Default: demo

  CustomDomainName:
    Type: String
    Default: voiceopsaihackathon.dev
    Description: Canonical public hostname for the VoiceOps frontend.

  CloudFrontCertificateArn:
    Type: String
    Description: ACM certificate ARN for voiceopsaihackathon.dev. The certificate must be in us-east-1 for CloudFront.

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'voiceops-${Environment}-oac'
        Description: CloudFront access to private VoiceOps frontend bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CanonicalDomainFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'voiceops-${Environment}-canonical-domain'
      AutoPublish: true
      FunctionConfig:
        Comment: Block requests that do not use the canonical VoiceOps custom domain
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
            var request = event.request;
            var host = request.headers.host.value;

            if (host !== "${CustomDomainName}") {
                return {
                    statusCode: 403,
                    statusDescription: "Forbidden",
                    headers: {
                        "content-type": {
                            value: "text/plain"
                        }
                    },
                    body: "Forbidden"
                };
            }

            return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases:
          - !Ref CustomDomainName
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CanonicalDomainFunction.FunctionARN
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action:
              - s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'voiceops-${Environment}-users'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'ON'
      EnabledMfas:
        - SOFTWARE_TOKEN_MFA
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'voiceops-${Environment}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub 'https://${Distribution.DomainName}/'
        - !Sub 'https://${CustomDomainName}/'
      LogoutURLs:
        - !Sub 'https://${Distribution.DomainName}/'
        - !Sub 'https://${CustomDomainName}/'
      EnableTokenRevocation: true

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub 'voiceops-${AWS::AccountId}-${Environment}'
      UserPoolId: !Ref UserPool

  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub 'voiceops_${Environment}_identity_pool'
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref UserPoolClient
          ProviderName: !GetAtt UserPool.ProviderName
          ServerSideTokenCheck: false

  AuthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'voiceops-${Environment}-authenticated-transcribe'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action:
              - sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: authenticated
      Policies:
        - PolicyName: VoiceOpsTranscribeStreaming
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - transcribe:StartStreamTranscription
                  - transcribe:StartStreamTranscriptionWebSocket
                Resource: '*'

  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        authenticated: !GetAtt AuthenticatedRole.Arn

Outputs:
  FrontendBucketName:
    Description: Upload index.html, styles.css, config.js, and bundle.js here.
    Value: !Ref FrontendBucket

  IdentityPoolId:
    Description: Cognito Identity Pool used to obtain authenticated temporary AWS credentials.
    Value: !Ref IdentityPool

  UserPoolId:
    Description: Cognito User Pool used to authenticate VoiceOps users.
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Browser app client ID.
    Value: !Ref UserPoolClient

  CognitoLoginDomain:
    Description: Cognito managed login domain.
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'

  AuthenticatedRoleArn:
    Description: IAM role used by authenticated browser sessions for Transcribe only.
    Value: !GetAtt AuthenticatedRole.Arn

  CloudFrontDistributionId:
    Value: !Ref Distribution

  CloudFrontDomainName:
    Value: !GetAtt Distribution.DomainName

  WebsiteUrl:
    Value: !Sub 'https://${CustomDomainName}'
